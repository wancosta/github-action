name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Generate test report
        run: |
          echo "Tests executed successfully" > test-results.txt
          echo "CI pipeline test report" >> test-results.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.txt

          
  artifact-check:

    needs:
      - test

    runs-on: ubuntu-latest

    steps:

      - name: Download test report
        uses: actions/download-artifact@v5
        with:
          name: test-report

      - name: Show test report
        run: cat test-results.txt
          

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tool
        run: pip install flake8

      - name: Run lint
        run: flake8 .


  security:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Security check
        run: echo "Running security checks..."

    
  info:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout informativo
        uses: actions/checkout@v4

      - name: Info check
        run: echo "Running CI on GitHub Actions" 

      - name: Info python version
        run: python --version  


  build:

    needs:
      - test
      - lint
      - security
      - info

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        run: |
          mkdir build
          cp app.py build/
          cp requeriments.txt build/
      
      - name: Show build
        run: | 
          echo "Build contents"
          ls -la build/ 

      - name: Upload application
        uses: action/upload-artfact@v4
        with:
          name: application
          path: build/
