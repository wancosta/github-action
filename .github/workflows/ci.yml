name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest


  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tool
        run: pip install flake8

      - name: Run lint
        run: flake8 .


  security:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Security check
        run: echo "Running security checks..."

    
  info:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout informativo
        uses: actions/checkout@v4

      - name: Info check
        run: echo "Running CI on GitHub Actions" 

      - name: Info check
        run: python --version  


  build:

    needs:
      - test
      - lint
      - security
      - info

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        run: echo "Building application..."
