name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Generate test report
        run: |
          echo "Tests executed successfully" > test-results.txt
          echo "CI pipeline test report" >> test-results.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.txt

          
  artifact-check:

    needs:
      - test

    runs-on: ubuntu-latest

    steps:

      - name: Download test report
        uses: actions/download-artifact@v5
        with:
          name: test-report

      - name: Show test report
        run: cat test-results.txt
          

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tool
        run: pip install flake8

      - name: Run lint
        run: flake8 .


  security:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Security check
        run: echo "Running security checks..."

    
  info:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout informativo
        uses: actions/checkout@v4

      - name: Info check
        run: echo "Running CI on GitHub Actions" 

      - name: Info python version
        run: python --version  


  docker-push:
    needs:
      - test
      - lint
      - security
      - info

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/github-actions-sre-lab:${{ github.sha }}
